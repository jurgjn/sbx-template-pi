# sbx-template-pi — Generic Pi coding agent kit
#
# Works with any OpenAI-compatible provider: Anthropic, OpenAI, DeepSeek,
# Kimi, Mistral, and more.  Pi is installed at sandbox creation via npm.
#
# Usage:
#   sbx run --kit ./sbx-kit/ pi
#   sbx run --kit "git+https://github.com/shaftoe/sbx-template-pi.git#dir=sbx-kit" pi
#
# Uses the llama.cpp router on the host (port 9931); no provider keys needed.
# Cloud providers can still be added from inside pi with /login.

schemaVersion: "1"
kind: agent
name: pi
displayName: Pi (generic)
description: >
  Pi coding agent with multi-provider support.
  Installs pi via npm at sandbox creation.
  Works with Anthropic, OpenAI, DeepSeek, Kimi, Mistral, and others.

# ---------------------------------------------------------------------------
# Image — pre-built Pi image from GitHub Container Registry
# ---------------------------------------------------------------------------
agent:
  image: ghcr.io/shaftoe/sbx-template-pi:latest
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

# ---------------------------------------------------------------------------
# Network — allow the npm registry and common LLM provider APIs
# ---------------------------------------------------------------------------
network:
  allowedDomains:
    - localhost:9931                # llama.cpp router on host (via host.docker.internal)
    - registry.npmjs.org            # npm install
    - api.anthropic.com:443         # Anthropic
    - console.anthropic.com:443
    - api.openai.com:443            # OpenAI
    - api.deepseek.com:443          # DeepSeek
    - api.mistral.ai:443            # Mistral
    - api.moonshot.cn:443           # Kimi (Moonshot)
    - api.z.ai:443                  # Z.ai
    - github.com:443                # git-based extensions
    - api.github.com:443            # gh CLI
    - pi.dev:443                    # Pi.dev
    - "*.pi.dev:443"

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
environment:
  # Pi's built-in llama.cpp provider reads this and discovers models, context
  # sizes and capabilities from the router on the host (no /login needed).
  variables:
    LLAMA_BASE_URL: http://host.docker.internal:9931

# ---------------------------------------------------------------------------
# Commands — everything is baked into the image. At startup, warm pi's model
# cache from the llama.cpp router: interactive pi only discovers models in the
# background after launch, so a fresh sandbox would otherwise start with no
# model selected. Gives up after ~10s if the router is unreachable.
# ---------------------------------------------------------------------------
commands:
  startup:
    - command: ["sh", "-c", '(sleep 15 | pi --mode rpc --no-session >/dev/null 2>&1 &); i=0; while [ $i -lt 20 ] && ! grep -q ''"llama.cpp"'' "$HOME/.pi/agent/models-store.json" 2>/dev/null; do sleep 0.5; i=$((i+1)); done']
      user: "1000"
      description: "Discover llama.cpp models so pi starts on the default model"

# ---------------------------------------------------------------------------
# Memory — brief sandbox orientation for the agent
# ---------------------------------------------------------------------------
memory: |
  ## Sandbox environment
  You are running inside a Docker sandbox (microVM). The workspace is mounted
  at its absolute host path. `sudo` is passwordless; use it for package installs.
  Docker is available inside the sandbox; containers you start are isolated in
  the microVM.

  If you need to install additional tools, use `apt-get`, `npm`, `pip`, or
  download binaries as needed.
